# The whole stack in one command:
#
#   docker compose up
#
# Mongo, the Nest API on :4321, and the Vite dev server on :5175. Open
# http://localhost:5175 — that is the one with hot reload, and its proxy sends
# /api, /guide and /asset through to the API container.
#
# Mongo is a hard requirement at boot: no database, no server. To run it alone
# and keep both Node processes on the host, `docker compose up -d mongo` still
# works exactly as before.
#
# Only the host side of each published port is configurable, and only because
# these are popular numbers — another project of yours may already hold one.
# Set GM_WEB_PORT / GM_API_PORT / GM_MONGO_PORT in .env to move them. Inside the
# stack the ports never change, so nothing else has to be kept in sync.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Loopback only. This mongod runs with no authentication — it never needed
    # any, because the only client was ever the server container reaching it by
    # service name over the compose network. The published port exists purely so
    # a host-side `pnpm run dev` and mongosh can reach it, and both are on this
    # machine. A wildcard bind offered an open database to every network the
    # laptop joins.
    ports:
      - '127.0.0.1:${GM_MONGO_PORT:-27017}:27017'
    volumes:
      - guide-manager-mongo:/data/db
    # The server bounds its connection attempts and exits when they run out, so
    # compose has to hold it back until Mongo actually answers rather than just
    # until the container exists.
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  server:
    build: .
    command: pnpm run dev
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # pnpm 11 runs a dependency-status check before `pnpm run <script>`, and
      # when it decides node_modules disagrees with the lockfile it wants to
      # remove the directory — which it refuses to do without a TTY, so the
      # container exits 1 and compose restarts it forever. That turns
      # `docker compose restart client` — an operation this repo's own
      # invariants require after any vite.config.ts edit — into a crash loop.
      # CI=true is pnpm's documented answer for a non-interactive environment:
      # it proceeds instead of asking. The dependencies themselves are the
      # image's, installed from the same lockfile, so there is nothing here for
      # a prompt to protect.
      CI: 'true'
      PORT: '4321'
      MONGO_URL: mongodb://mongo:27017/guide-manager
      # The registry stores absolute host paths, and defaultRegistryFile() reads
      # ~/.guide-manager/registry.json off homedir() — which on Linux is $HOME.
      # Pointing it at the same path the mount below uses keeps both honest.
      HOME: ${HOME}
    # Loopback only, like the other two. This port answers the API, the guide
    # render routes and — once `pnpm run build` has run — the built client
    # bundle, so a wildcard bind here re-exposes the entire board even with the
    # Vite port shut, and there is no auth anywhere in front of it. The client
    # container does not use this mapping at all: it reaches the API by service
    # name over the compose network (API_HOST below), so the publish is for
    # host-side curl and nothing else.
    #
    # To read the production bundle from the phone rather than the Vite dev
    # server, put a serve in front of this port too — the same shape
    # bin/tailnet.js uses, with GM_API_PORT.
    ports:
      - '127.0.0.1:${GM_API_PORT:-4321}:4321'
    volumes:
      - .:/app
      - guide-manager-node-modules:/app/node_modules
      # The registry names guides by absolute host path, so those paths have to
      # mean the same thing inside the container — hence each mount landing on
      # its own path rather than somewhere tidy like /guides. Without them every
      # guide fails existsSync and the board comes up empty.
      #
      # Scoped to the registry plus one guide root rather than all of $HOME:
      # mount size costs nothing under VirtioFS (no scan, no index, and nothing
      # here is watched), but a whole-home mount also hands the container
      # ~/.ssh, ~/.aws and Keychains, which it has no use for. Point
      # GM_GUIDE_ROOT at a different tree, or add another line, if you start
      # writing guides outside it — a guide the container cannot see is silently
      # dropped from the list, not an error.
      #
      # Read-only throughout: the server never writes here. bin/register.js
      # does, and that runs on the host.
      - ${HOME}/.guide-manager:${HOME}/.guide-manager:ro
      - ${GM_GUIDE_ROOT:-${HOME}/Documents/custom-projects}:${GM_GUIDE_ROOT:-${HOME}/Documents/custom-projects}:ro

  client:
    build: .
    command: pnpm run dev:web
    restart: unless-stopped
    depends_on:
      - server
    environment:
      # pnpm 11 runs a dependency-status check before `pnpm run <script>`, and
      # when it decides node_modules disagrees with the lockfile it wants to
      # remove the directory — which it refuses to do without a TTY, so the
      # container exits 1 and compose restarts it forever. That turns
      # `docker compose restart client` — an operation this repo's own
      # invariants require after any vite.config.ts edit — into a crash loop.
      # CI=true is pnpm's documented answer for a non-interactive environment:
      # it proceeds instead of asking. The dependencies themselves are the
      # image's, installed from the same lockfile, so there is nothing here for
      # a prompt to protect.
      CI: 'true'
      # vite.config.ts builds its proxy target from these. localhost inside this
      # container is this container, so the API has to be named by service.
      API_HOST: server
      PORT: '4321'
      WEB_PORT: '5175'
      # Bind-mount file events are unreliable enough on Docker Desktop that
      # chokidar can miss edits outright; polling costs a little CPU and always
      # notices.
      CHOKIDAR_USEPOLLING: 'true'
    # Loopback on the host side, unlike the API and Mongo publishes above. The
    # board renders guides read out of this filesystem and has nothing in front
    # of it asking who you are, so a wildcard bind offered it to every network
    # this laptop joins — a hotel wifi included. The tailnet reaches it through
    # `pnpm run tailnet`, which registers a tailscale serve on this same port
    # number; see bin/tailnet.js for why that number is read from .env rather
    # than typed. Note this is the host side only: WEB_PORT above still leaves
    # Vite on host:true inside the container, because bound to
    # container-localhost it would refuse the forwarded connection.
    ports:
      - '127.0.0.1:${GM_WEB_PORT:-5175}:5175'
    volumes:
      - .:/app
      - guide-manager-node-modules:/app/node_modules

volumes:
  guide-manager-mongo:
  guide-manager-node-modules:
